<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Bureau - Enter the Matrix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #00ff41;
            font-family: 'Inconsolata', monospace;
            overflow: hidden;
            height: 100vh;
            position: relative;
            background-image: radial-gradient(circle at center, rgba(0, 30, 0, 0.8) 0%, rgba(0, 0, 0, 1) 70%);
        }
        
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.2;
            z-index: -1;
        }
        
        .matrix-char {
            position: absolute;
            font-size: 16px;
            animation: fall linear infinite;
            color: #00ff41;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.7);
            opacity: 0.8;
        }
        
        @keyframes fall {
            0% { transform: translateY(-100vh); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .logo {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41;
            animation: pulse 2s infinite;
            letter-spacing: -2px;
            position: relative;
        }
        
        .logo::after {
            content: "_";
            animation: blink 1s infinite;
            position: absolute;
            right: -15px;
        }
