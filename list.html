<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[CLASSIFIED] Aartless Archive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0a0a0a;
            color: #00ff41;
            overflow-x: hidden;
            position: relative;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 65, 0.03),
                rgba(0, 255, 65, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 10, 10, 0.8) 100%);
            pointer-events: none;
            z-index: 999;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            41%, 42%, 43% { opacity: 0.8; }
            45% { opacity: 0.9; }
        }

        .header h1 {
            font-family: 'VT323', monospace;
            font-size: 48px;
            color: #ff0040;
            text-shadow: 0 0 10px #ff0040, 0 0 20px #ff0040, 0 0 30px #ff0040;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .header .subtitle {
            color: #00ff41;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header .classified {
            display: inline-block;
            background: #ff0040;
            color: #0a0a0a;
            padding: 5px 15px;
            margin-top: 10px;
            font-weight: bold;
            transform: skew(-5deg);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .info-bar {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid #00ff41;
            padding: 15px;
            margin-bottom: 30px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-bar a {
            color: #ff0040;
            text-decoration: none;
            transition: all 0.3s;
        }

        .info-bar a:hover {
            text-shadow: 0 0 10px #ff0040;
        }

        .search-container {
            margin-bottom: 30px;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            background: rgba(0, 255, 65, 0.05);
            border: 2px solid #00ff41;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box:focus {
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        .search-box::placeholder {
            color: rgba(0, 255, 65, 0.5);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 150px;
            background: rgba(255, 0, 64, 0.1);
            border: 1px solid #ff0040;
            padding: 15px;
            text-align: center;
        }

        .stat-box .label {
            font-size: 12px;
            opacity: 0.7;
        }

        .stat-box .value {
            font-size: 32px;
            font-family: 'VT323', monospace;
            color: #ff0040;
            text-shadow: 0 0 10px #ff0040;
        }

        .url-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .url-link {
            display: block;
            padding: 15px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid #00ff41;
            color: #00ff41;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            word-break: break-all;
        }

        .url-link::before {
            content: '>';
            position: absolute;
            left: -20px;
            transition: all 0.3s;
        }

        .url-link:hover {
            background: rgba(0, 255, 65, 0.15);
            border-color: #ff0040;
            color: #ff0040;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.3);
            padding-left: 25px;
        }

        .url-link:hover::before {
            left: 10px;
        }

        .terminal-cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #00ff41;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
            padding: 20px;
            border-top: 1px solid #00ff41;
        }

        .matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
        }

        @keyframes glitchAnim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitch {
            animation: glitchAnim 0.3s infinite;
        }
    </style>
</head>
<body>
    <canvas class="matrix"></canvas>
    <div class="scanlines"></div>
    <div class="glitch-overlay"></div>

    <div class="container">
        <div class="header">
            <h1 class="glitch">AARTLESS ARCHIVE</h1>
            <div class="subtitle">UNAUTHORIZED ACCESS DETECTED<span class="terminal-cursor"></span></div>
            <div class="classified">⚠ CLASSIFIED ⚠</div>
        </div>

        <div class="info-bar">
            <span>📁 SOURCE: <a href="https://github.com/alx0r/Aartless/" target="_blank">github.com/alx0r/Aartless/</a></span>
            <span>🌐 DOMAIN: alx0r.github.io</span>
            <span id="timestamp"></span>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" id="searchBox" placeholder="[SEARCH DATABASE] Enter query...">
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="label">TOTAL FILES</div>
                <div class="value" id="totalCount">0</div>
            </div>
            <div class="stat-box">
                <div class="label">VISIBLE</div>
                <div class="value" id="visibleCount">0</div>
            </div>
            <div class="stat-box">
                <div class="label">ACCESS LEVEL</div>
                <div class="value">∞</div>
            </div>
        </div>

        <div class="url-grid" id="urlGrid"></div>

        <div class="footer">
            [SYSTEM MESSAGE] All transmissions are monitored and logged.<br>
            Connection established via secure channel: AARTLESS-NODE-001
        </div>
    </div>

    <script>
        // Matrix rain effect
        const canvas = document.querySelector('.matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // Timestamp
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = 
                `⏰ ${now.toISOString().replace('T', ' ').substring(0, 19)} UTC`;
        }
        updateTimestamp();
        setInterval(updateTimestamp, 1000);

        // URLs
        const baseUrl = 'https://alx0r.github.io/Aartless/';
        
        const files = [
            'Aart.html', 'Alice.html', 'Alice2.html', 'Alice3.html', 'Alice4.html',
            'Anna.html', 'Carol1.html', 'Carol2.html', 'Carol3.html', 'Carol4.html',
            'Drparish.html', 'Kal.html', 'OPME.html', 'Orisco.html', 'Wolf.html',
            'alexa.html', 'alexander24.html', 'alexander_rabbit.html', 'alexbex.html',
            'all.html', 'alex.html', 'annab.html', 'awe.html', 'bab.html', 'bex.html',
            'blankpage1.html', 'block.html', 'bloom.html', 'bloom1.html', 'bloom2.html',
            'bro.html', 'browse.html', 'bruh.html', 'bue.html', 'call.html',
            'catismcord.html', 'catisms.html', 'clouds.html', 'comment.html', 'copy.html',
            'dait.html', 'degree.html', 'diss.html', 'drc.html', 'drparrish.html',
            'foxhunt1.html', 'frikday.html', 'future.html', 'gatsby.html', 'goat.html',
            'goatt.html', 'grow.html', 'html.html', 'ijo.html', 'index.html',
            'jazz.html', 'jjade.html', 'lethe.html', 'like.html', 'lru.html',
            'maddi.html', 'maddie.html', 'magical.html', 'marlene.html', 'mephistopheles.html',
            'mkh.html', 'mikayla.html', 'mirror_mirror.html', 'mit.html', 'mitchell.html',
            'mob_e.html', 'muc.html', 'mute.html', 'nass.html', 'nas_es.html',
            'nasty.html', 'nastyeez.html', 'nastynastynasty.html', 'nastypro.html',
            'nastyprod.html', 'nastys.html', 'nastysnastiest.html', 'niccc.html',
            'real.html', 'reality2.html', 'reality432.html', 'realpro.html', 'report.html',
            'sad.html', 'scan.html', 'share.html', 'smart.html', 'smiley.html',
            'snapshot.html', 'sora.html', 'sud-m.html', 'sudHRI.html', 'taxed.html',
            'teggin.html', 'tiger.html', 'toogood.html', 'trackfox.html', 'vampire.html',
            'walmission.html', 'walservices.html', 'wanderwiseai.html', 'witch.html'
        ];

        const urlGrid = document.getElementById('urlGrid');
        const searchBox = document.getElementById('searchBox');
        const totalCount = document.getElementById('totalCount');
        const visibleCount = document.getElementById('visibleCount');

        function renderUrls(filteredFiles) {
            urlGrid.innerHTML = '';
            filteredFiles.forEach(file => {
                const url = baseUrl + file;
                const link = document.createElement('a');
                link.href = url;
                link.className = 'url-link';
                link.textContent = `[ACCESS] ${file}`;
                link.target = '_blank';
                urlGrid.appendChild(link);
            });
            visibleCount.textContent = filteredFiles.length;
        }

        searchBox.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = files.filter(file => 
                file.toLowerCase().includes(searchTerm)
            );
            renderUrls(filtered);
        });

        totalCount.textContent = files.length;
        renderUrls(files);
    </script>
</body>
</html>
