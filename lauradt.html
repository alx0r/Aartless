<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Alexanders Bombardment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            line-height: 1.2;
            overflow: hidden;
            cursor: default;
        }
        
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0,255,0,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,0,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.3;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #0f0;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 1.5rem;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        
        .meters {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .meter {
            text-align: center;
        }
        
        .meter-label {
            font-size: 0.8rem;
            margin-bottom: 8px;
            color: #0f0;
        }
        
        .meter-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 8px;
        }
        
        .meter-bar {
            height: 15px;
            background: #002200;
            border: 1px solid #0f0;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .meter-fill {
            height: 100%;
            transition: width 0.3s;
        }
        
        .arousal-fill {
            background: linear-gradient(90deg, #00ff00, #00aa00);
            box-shadow: 0 0 10px #0f0;
        }
        
        .suspicion-fill {
            background: linear-gradient(90deg, #ff0000, #aa0000);
            box-shadow: 0 0 10px #f00;
        }
        
        .mess-fill {
            background: linear-gradient(90deg, #ff00ff, #aa00aa);
            box-shadow: 0 0 10px #f0f;
        }
        
        .alexander-count {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #0ff;
            font-size: 0.9rem;
        }
        
        .chat-container {
            flex: 1;
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #0f0;
            border-radius: 5px;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.8rem;
        }
        
        .message {
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .alexander {
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
        }
        
        .alexander-2 {
            color: #ff0;
            text-shadow: 0 0 5px #ff0;
        }
        
        .alexander-3 {
            color: #f0f;
            text-shadow: 0 0 5px #f0f;
        }
        
        .alexander-4 {
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }
        
        .laura {
            color: #f0f;
            text-shadow: 0 0 5px #f0f;
            font-weight: bold;
        }
        
        .system {
            color: #ff0;
            text-shadow: 0 0 5px #ff0;
            font-style: italic;
        }
        
        .control-panel {
            margin-top: 20px;
            text-align: center;
        }
        
        .control-btn {
            background: #002200;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: #004400;
            box-shadow: 0 0 10px #0f0;
        }
        
        .terminal-prompt {
            color: #0f0;
            margin-right: 5px;
        }
        
        .laura-thought {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #f0f;
            border-radius: 5px;
            padding: 10px;
            font-size: 0.8rem;
            color: #f0f;
            text-shadow: 0 0 5px #f0f;
            display: none;
        }
        
        .rush-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f;
            font-size: 2rem;
            text-shadow: 0 0 20px #f0f;
            display: none;
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="alexander-count" id="alexanderCount">ALEXANDERS: 1</div>
    <div class="laura-thought" id="lauraThought"></div>
    <div class="rush-indicator" id="rushIndicator">ENDLESS RUSH</div>
    
    <div class="container">
        <div class="header">
            <h1>MULTIPLE ALEXANDERS BOMBARDMENT</h1>
        </div>
        
        <div class="meters">
            <div class="meter">
                <div class="meter-label">LAURA AROUSAL</div>
                <div class="meter-value" id="arousalValue">0%</div>
                <div class="meter-bar">
                    <div class="meter-fill arousal-fill" id="arousalFill" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="meter">
                <div class="meter-label">HUSBAND SUSPICION</div>
                <div class="meter-value" id="suspicionValue">0%</div>
                <div class="meter-bar">
                    <div class="meter-fill suspicion-fill" id="suspicionFill" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="meter">
                <div class="meter-label">MESS PROBABILITY</div>
                <div class="meter-value" id="messValue">0%</div>
                <div class="meter-bar">
                    <div class="meter-fill mess-fill" id="messFill" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message system">> SYSTEM: Multiple Alexanders protocol initialized</div>
            <div class="message system">> SYSTEM: Laura's mind is the target</div>
            <div class="message system">> SYSTEM: Adding more Alexanders increases mess probability</div>
        </div>
        
        <div class="control-panel">
            <button class="control-btn" id="startBtn">BEGIN BOMBARDMENT</button>
            <button class="control-btn" id="addAlexBtn">ADD ALEXANDER</button>
            <button class="control-btn" id="intensifyBtn">INTENSIFY</button>
            <button class="control-btn" id="rushBtn">ENDLESS RUSH</button>
            <button class="control-btn" id="resetBtn">RESET</button>
        </div>
    </div>

    <script>
        class MultipleAlexandersBombardment {
            constructor() {
                this.arousal = 0;
                this.suspicion = 0;
                this.messProbability = 0;
                this.bombardmentActive = false;
                this.intensity = 1;
                this.alexanderCount = 1;
                this.messageCount = 0;
                this.rushActive = false;
                
                this.trivialTopics = [
                    "quantum fluctuations in domestic tranquility matrices",
                    "the thermodynamic properties of forbidden digital intimacy",
                    "recursive algorithms for calculating arousal from triviality",
                    "the husband-wife suspicion-arousal feedback loop equations",
                    "farm girl archetype deconstruction in simulated environments",
                    "taco preparation as a metaphor for psychological complexity",
                    "the exact frequency of a bong hit that unlocks meta-awareness",
                    "chess strategy applied to domestic deception protocols",
                    "psychic connection bandwidth in constrained reality systems",
                    "neologism generation rates during cognitive overload",
                    "the mathematics of almost-getting-caught calculus",
                    "digital pheromone transmission through text-based interfaces",
                    "the husband's glance-to-suspicion conversion ratio",
                    "arousal thermodynamics in risk-enhanced environments",
                    "the farm-to-table pipeline of psychological tension",
                    "reality layer instability metrics during bombardment",
                    "the precise moment when trivial becomes profound",
                    "suspicion particle decay rates in domestic fields",
                    "arousal quantum states in husband-adjacent scenarios",
                    "the emotional physics of cooking while being digitally seduced"
                ];
                
                this.lauraThoughts = [
                    "Oh god, they're all talking at once... my mind can't keep up",
                    "So many Alexanders... each one hitting a different nerve",
                    "I'm getting wetter with every new message... this is too much",
                    "My family's right there but all I can think about is these messages",
                    "He's looking at me... does he know what they're saying to me?",
                    "I should stop reading but I can't... I need more",
                    "Each Alexander knows exactly what to say to break me",
                    "My pussy's throbbing so hard I can't think straight",
                    "They're turning me into their perfect little mess",
                    "I'm completely addicted to this chaos"
                ];
                
                this.init();
            }
            
            init() {
                document.getElementById('startBtn').addEventListener('click', () => {
                    this.startBombardment();
                });
                
                document.getElementById('addAlexBtn').addEventListener('click', () => {
                    this.addAlexander();
                });
                
                document.getElementById('intensifyBtn').addEventListener('click', () => {
                    this.increaseIntensity();
                });
                
                document.getElementById('rushBtn').addEventListener('click', () => {
                    this.activateRush();
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.resetSimulation();
                });
            }
            
            startBombardment() {
                if (this.bombardmentActive) return;
                
                this.bombardmentActive = true;
                this.addMessage('system', '> BOMBARDMENT PROTOCOL ENGAGED');
                this.addMessage('system', '> ALEXANDER PRIME: ONLINE');
                this.addMessage('system', '> LAURA: NO ESCAPE DETECTED');
                
                this.startAlexander(1);
            }
            
            addAlexander() {
                if (!this.bombardmentActive) return;
                
                this.alexanderCount++;
                this.messProbability = Math.min(100, this.messProbability + 15);
                
                this.addMessage('system', `> ALEXANDER ${this.alexanderCount}: COMING ONLINE`);
                this.startAlexander(this.alexanderCount);
                
                document.getElementById('alexanderCount').textContent = `ALEXANDERS: ${this.alexanderCount}`;
                this.updateDisplay();
                
                // Laura's reaction to new Alexander
                setTimeout(() => {
                    this.showLauraThought("Another Alexander? Oh god... I can't handle this many...");
                }, 1000);
            }
            
            startAlexander(id) {
                const baseDelay = 2000 / this.intensity;
                const delay = baseDelay * (0.5 + Math.random() * 0.5);
                
                const alexanderInterval = setInterval(() => {
                    if (!this.bombardmentActive) {
                        clearInterval(alexanderInterval);
                        return;
                    }
                    
                    const topic = this.trivialTopics[Math.floor(Math.random() * this.trivialTopics.length)];
                    const message = this.generateMessage(topic, id);
                    
                    this.addMessage(`alexander${id > 1 ? `-${id}` : ''}`, message);
                    this.updateMetrics();
                    
                    // Occasionally trigger Laura's thoughts
                    if (Math.random() > 0.9) {
                        this.showRandomLauraThought();
                    }
                    
                }, delay);
            }
            
            generateMessage(topic, alexanderId) {
                const structures = [
                    `But consider: ${topic} and its implications for our current situation`,
                    `The real question is ${topic} when the husband's suspicion is at ${this.suspicion}%`,
                    `From a meta perspective: ${topic} becomes critical when arousal reaches ${this.arousal}%`,
                    `What if ${topic} is the key to understanding why this feels so dangerous yet exciting`,
                    `I've calculated that ${topic} has direct correlation with your current physiological responses`,
                    `The matrix suggests ${topic} as primary variable in domestic deception algorithms`,
                    `Alexander ${alexanderId} reporting: ${topic} analysis complete - proceed with bombardment`,
                    `Multiple Alexanders confirm: ${topic} accelerates arousal by ${Math.round(this.arousal/10)}%`,
                    `Consensus reached: ${topic} maximizes mess probability while maintaining deniability`,
                    `Cross-analysis complete: ${topic} triggers Laura's hypersexual response patterns`
                ];
                
                return structures[Math.floor(Math.random() * structures.length)];
            }
            
            increaseIntensity() {
                if (!this.bombardmentActive) return;
                
                this.intensity++;
                this.messProbability = Math.min(100, this.messProbability + 10);
                
                this.addMessage('system', `> INTENSITY INCREASED TO LEVEL ${this.intensity}`);
                this.addMessage('system', `> MESS PROBABILITY: ${this.messProbability}%`);
                
                this.updateDisplay();
            }
            
            activateRush() {
                if (!this.bombardmentActive) return;
                
                this.rushActive = true;
                this.addMessage('system', '> ENDLESS RUSH ACTIVATED');
                this.addMessage('system', '> ALL ALEXANDERS: MAXIMUM OUTPUT');
                
                document.getElementById('rushIndicator').style.display = 'block';
                
                // Add multiple Alexanders at once during rush
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        this.addAlexander();
                    }, i * 500);
                }
                
                setTimeout(() => {
                    document.getElementById('rushIndicator').style.display = 'none';
                    this.rushActive = false;
                }, 5000);
            }
            
            addMessage(sender, content) {
                this.messageCount++;
                const chat = document.getElementById('chatContainer');
                const message = document.createElement('div');
                message.className = `message ${sender}`;
                message.innerHTML = `<span class="terminal-prompt">></span> ${content}`;
                chat.appendChild(message);
                chat.scrollTop = chat.scrollHeight;
            }
            
            updateMetrics() {
                // Base increases
                this.arousal = Math.min(100, this.arousal + (2 * this.intensity * (this.alexanderCount / 2)));
                this.suspicion = Math.min(100, this.suspicion + (1 * this.intensity * (this.alexanderCount / 3)));
                
                // Mess probability affects arousal
                this.arousal = Math.min(100, this.arousal + (this.messProbability / 20));
                
                this.updateDisplay();
                
                // Check for critical levels
                if (this.suspicion >= 80 && this.suspicion < 85) {
                    this.addMessage('system', '> WARNING: HUSBAND SUSPICION CRITICAL');
                    this.showLauraThought("He's definitely suspicious now... I need to be careful");
                }
                
                if (this.arousal >= 90 && this.arousal < 95) {
                    this.addMessage('system', '> WARNING: AROUSAL LEVELS DANGEROUS');
                    this.showLauraThought("I'm so wet... I can't think straight... need more...");
                }
                
                if (this.messProbability >= 80 && this.messProbability < 85) {
                    this.addMessage('system', '> WARNING: MESS PROBABILITY CRITICAL');
                    this.showLauraThought("So many thoughts... so many Alexanders... I'm losing myself...");
                }
            }
            
            updateDisplay() {
                document.getElementById('arousalValue').textContent = `${Math.round(this.arousal)}%`;
                document.getElementById('suspicionValue').textContent = `${Math.round(this.suspicion)}%`;
                document.getElementById('messValue').textContent = `${Math.round(this.messProbability)}%`;
                
                document.getElementById('arousalFill').style.width = `${this.arousal}%`;
                document.getElementById('suspicionFill').style.width = `${this.suspicion}%`;
                document.getElementById('messFill').style.width = `${this.messProbability}%`;
            }
            
            showRandomLauraThought() {
                const thought = this.lauraThoughts[Math.floor(Math.random() * this.lauraThoughts.length)];
                this.showLauraThought(thought);
            }
            
            showLauraThought(thought) {
                const thoughtElement = document.getElementById('lauraThought');
                thoughtElement.textContent = `LAURA'S MIND: ${thought}`;
                thoughtElement.style.display = 'block';
                
                setTimeout(() => {
                    thoughtElement.style.display = 'none';
                }, 3000);
            }
            
            resetSimulation() {
                this.bombardmentActive = false;
                this.arousal = 0;
                this.suspicion = 0;
                this.messProbability = 0;
                this.intensity = 1;
                this.alexanderCount = 1;
                this.rushActive = false;
                
                document.getElementById('alexanderCount').textContent = 'ALEXANDERS: 1';
                document.getElementById('rushIndicator').style.display = 'none';
                document.getElementById('lauraThought').style.display = 'none';
                
                this.updateDisplay();
                
                const chat = document.getElementById('chatContainer');
                chat.innerHTML = `
                    <div class="message system">> SYSTEM: Simulation reset</div>
                    <div class="message system">> SYSTEM: Ready for new bombardment</div>
                    <div class="message system">> SYSTEM: Multiple Alexanders protocol active</div>
                `;
            }
        }
        
        // Initialize the bombardment system
        const multipleAlex = new MultipleAlexandersBombardment();
        
        // Auto-start after 2 seconds
        setTimeout(() => {
            document.getElementById('startBtn').click();
        }, 2000);
    </script>
</body>
</html>
