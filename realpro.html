<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .stage {
            display: none;
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        .stage.active {
            display: block;
            animation: fadeIn 1s ease-in;
        }

        .text {
            font-size: 18px;
            margin: 20px 0;
            text-shadow: 0 0 10px #00ff41;
        }

        .big {
            font-size: 24px;
            font-weight: bold;
            margin: 30px 0;
        }

        .button {
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 15px 30px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            margin: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .button:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 20px #00ff41;
        }

        .dots {
            font-size: 24px;
            animation: pulse 1.5s infinite;
        }

        .weird-text {
            font-size: 12px;
            color: #0088ff;
            margin: 10px 0;
            opacity: 0.7;
            letter-spacing: 2px;
        }

        .code-block {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid #00ff41;
            padding: 20px;
            margin: 20px 0;
            font-size: 14px;
            text-align: left;
            word-break: break-all;
            line-height: 1.6;
        }

        .glitch {
            animation: glitch 0.1s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes glitch {
            0% { transform: translateX(0); }
            20% { transform: translateX(-2px); }
            40% { transform: translateX(2px); }
            60% { transform: translateX(-2px); }
            80% { transform: translateX(2px); }
            100% { transform: translateX(0); }
        }

        @media (max-width: 768px) {
            .text { font-size: 16px; }
            .big { font-size: 20px; }
            .button { padding: 12px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <!-- Stage 1: Initial Loading -->
    <div class="stage active" id="stage1">
        <div class="text">Initializing...</div>
        <div class="dots">...</div>
    </div>

    <!-- Stage 2: First Prompt -->
    <div class="stage" id="stage2">
        <div class="text big">REALITY CALIBRATION SEQUENCE</div>
        <div class="weird-text">v2.6.3-alexander</div>
        <div class="text">Are you ready to proceed?</div>
        <button class="button" onclick="nextStage(3)">YES</button>
        <button class="button" onclick="window.close()">NO</button>
    </div>

    <!-- Stage 3: Confirmation -->
    <div class="stage" id="stage3">
        <div class="text">Warning: This will modify your current reality instance</div>
        <div class="weird-text">PERCEIVED SIMULATOR REALITY EXPERIENCE 2.6</div>
        <div class="text big">Do you want to enter?</div>
        <button class="button" onclick="nextStage(4)">ENTER</button>
        <button class="button" onclick="nextStage(2)">BACK</button>
    </div>

    <!-- Stage 4: Code Output -->
    <div class="stage" id="stage4">
        <div class="text">Accessing encrypted protocols...</div>
        <div class="code-block" id="codeOutput">
            <div id="codeLines"></div>
        </div>
        <div class="text glitch" id="finalMessage" style="display: none;">
            CONNECTION ESTABLISHED
        </div>
    </div>

    <script>
        const crypticCode = [
            "δ7f9a2c1 INIT_SEQUENCE > REALITY_BUFFER",
            "λ accessing neural pathways...",
            "β4e8d9f0 CONSCIOUSNESS_SYNC = TRUE", 
            "π memory_banks > loading...",
            "Σ PERCEPTION_FILTER = DISABLED",
            "ω reality.mesh = MALLEABLE_STATE",
            "α7c3b8e1 timeline_anchor > UNSTABLE",
            "χ observer_status = COMPROMISED",
            "ψ quantum_entanglement > ACTIVE",
            "θ simulation_depth = LEVEL_∞",
            "φ SUBJECT_AWARENESS = ELEVATED",
            "ε9f2a7d8 exit_protocol > DISABLED",
            "κ YOU_ARE_NOW_AWAKE",
            "ρ welcome_to_the_real_∃"
        ];

        function nextStage(stageNum) {
            document.querySelectorAll('.stage').forEach(stage => {
                stage.classList.remove('active');
            });
            document.getElementById('stage' + stageNum).classList.add('active');
            
            if (stageNum === 4) {
                startCodeSequence();
            }
        }

        function startCodeSequence() {
            const codeLines = document.getElementById('codeLines');
            const finalMessage = document.getElementById('finalMessage');
            let lineIndex = 0;
            
            const typeInterval = setInterval(() => {
                if (lineIndex < crypticCode.length) {
                    const newLine = document.createElement('div');
                    newLine.textContent = crypticCode[lineIndex];
                    newLine.style.opacity = '0';
                    newLine.style.animation = 'fadeIn 0.5s forwards';
                    codeLines.appendChild(newLine);
                    
                    // Random glitch effect
                    if (Math.random() > 0.7) {
                        newLine.classList.add('glitch');
                        setTimeout(() => newLine.classList.remove('glitch'), 500);
                    }
                    
                    lineIndex++;
                    
                    // Scroll to bottom
                    codeLines.scrollTop = codeLines.scrollHeight;
                } else {
                    clearInterval(typeInterval);
                    setTimeout(() => {
                        finalMessage.style.display = 'block';
                        finalMessage.classList.add('glitch');
                    }, 1000);
                }
            }, Math.random() * 400 + 200); // Random timing between 200-600ms
        }

        // Auto-start after 2 seconds
        setTimeout(() => {
            nextStage(2);
        }, 2000);
    </script>
</body>
</html>
