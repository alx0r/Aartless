<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEXANDER v3.7.2 - Reality Paradox Simulation</title>
    <style>
        /* (CSS remains unchanged from your original) */
    </style>
</head>
<body>
    <!-- HTML structure remains unchanged from your original -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const stages = document.querySelectorAll('.stage');
            const layers = document.querySelectorAll('.reality-layer');
            const neuralCanvas = document.getElementById('neuralCanvas');
            const userNameInput = document.getElementById('userName');
            const userNameDisplay = document.getElementById('userNameDisplay');
            const realityControls = document.querySelector('.reality-controls');
            const codeLines = document.getElementById('codeLines');
            
            // State variables
            let currentStage = 1;
            let currentLayer = 0;
            let userName = '';
            let activeSymbols = new Set();
            let choiceType = '';
            let languageInterval;
            let codeInterval;
            
            // Initialize neural network background
            function initNeuralNetwork() {
                const canvas = document.createElement('canvas');
                neuralCanvas.appendChild(canvas);
                const ctx = canvas.getContext('2d');
                
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                
                const chars = "ΑΛΕΞΑΝΔΡΟΣΜΑΚΕΔΩΝ日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789∃∀∅∞∫∂∇⊕";
                const fontSize = 16;
                const columns = Math.floor(canvas.width / fontSize);
                const drops = Array(columns).fill(1);
                
                function draw() {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#00ff41';
                    ctx.font = `${fontSize}px monospace`;
                    
                    for (let i = 0; i < drops.length; i++) {
                        const char = chars[Math.floor(Math.random() * chars.length)];
                        ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                        
                        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                            drops[i] = 0;
                        }
                        
                        drops[i]++;
                    }
                }
                
                setInterval(draw, 60);
            }
            
            // Enhanced stage navigation
            function showStage(stageNum) {
                stages.forEach(stage => stage.classList.remove('active'));
                const targetStage = document.getElementById(`stage${stageNum}`);
                if (targetStage) {
                    targetStage.classList.add('active');
                    currentStage = stageNum;
                    
                    // Dynamic background effects
                    const bgEffects = {
                        2: 'radial-gradient(circle, #001a00, #000)',
                        3: 'radial-gradient(circle, #1a0000, #000)',
                        5: 'radial-gradient(circle, #1a0a00, #000)',
                        6: 'linear-gradient(135deg, #000, #001a00, #1a0000)'
                    };
                    
                    document.body.style.background = bgEffects[stageNum] || '#000';
                    
                    // Stage-specific initialization
                    if (stageNum === 6) startCodeSequence();
                }
            }
            
            // Enhanced layer navigation
            function showLayer(layerNum) {
                layers.forEach(layer => layer.classList.remove('active'));
                const targetLayer = document.getElementById(`layer${layerNum}`);
                if (targetLayer) {
                    targetLayer.classList.add('active');
                    currentLayer = layerNum;
                    
                    // Clear previous language shift
                    if (languageInterval) clearInterval(languageInterval);
                    
                    // Layer-specific effects
                    const layerEffects = {
                        1: 'radial-gradient(circle, #003300, #000)',
                        2: 'radial-gradient(circle, #000033, #000)',
                        3: 'radial-gradient(circle, #330000, #000)',
                        4: 'radial-gradient(circle, #220022, #000)'
                    };
                    
                    document.body.style.background = layerEffects[layerNum] || '#000';
                    
                    if (layerNum === 2) startLanguageShift();
                    if (layerNum === 4) userNameDisplay.textContent = userName;
                    
                    realityControls.style.display = 'flex';
                }
            }
            
            // Language shifting effect
            function startLanguageShift() {
                const texts = document.querySelectorAll('.random-language');
                const languages = [
                    "Γλώσσα είναι φυλακή του νου", // Greek
                    "语言是思想的牢笼", // Chinese
                    "Le langage est la prison de l'esprit", // French
                    "Die Sprache ist das Gefängnis des Geistes", // German
                    "言語は心の牢獄である", // Japanese
                    "اللغة هي سجن العقل" // Arabic
                ];
                
                // Initial shuffle
                texts.forEach(text => {
                    const randomIndex = Math.floor(Math.random() * languages.length);
                    text.textContent = languages[randomIndex];
                });
                
                languageInterval = setInterval(() => {
                    texts.forEach(text => {
                        const randomIndex = Math.floor(Math.random() * languages.length);
                        text.textContent = languages[randomIndex];
                        text.classList.add('glitch');
                        setTimeout(() => text.classList.remove('glitch'), 300);
                    });
                }, 4000);
            }
            
            // Enhanced code sequence with typewriter effect
            function startCodeSequence() {
                const crypticCode = [
                    "α7d9a2c1 ALEXANDER_INIT > NEURAL_BUFFER",
                    "β accessing consciousness pathways...",
                    "γ4e8d9f0 PERCEPTION_SYNC = ACTIVE",
                    "δ memory_engrams > loading...",
                    "ε synaptic_bridges: 87%",
                    "ζ quantum_state: ENTANGLED",
                    "η cognitive_filters: DISABLED",
                    "θ reality_parameters: SET",
                    "ι temporal_coherence: 0.87",
                    "κ paradox_threshold: EXCEEDED",
                    "λ launching REALITY_SYNTHESIS_ENGINE",
                    "μ neural_signature: VALIDATED",
                    "ν protocol_status: ACTIVE",
                    "ξ welcome to ALEXANDER v3.7.2"
                ];
                
                let lineIndex = 0;
                let charIndex = 0;
                let output = '';
                
                if (codeInterval) clearInterval(codeInterval);
                
                codeInterval = setInterval(() => {
                    if (lineIndex < crypticCode.length) {
                        const line = crypticCode[lineIndex];
                        
                        if (charIndex <= line.length) {
                            output = crypticCode.slice(0, lineIndex).join('\n') + '\n' + line.substring(0, charIndex);
                            codeLines.textContent = output;
                            charIndex++;
                        } else {
                            lineIndex++;
                            charIndex = 0;
                        }
                    } else {
                        clearInterval(codeInterval);
                        document.getElementById('accessMessage').style.display = 'block';
                        setTimeout(() => showLayer(0), 2000);
                    }
                    
                    // Auto-scroll
                    const container = document.getElementById('codeOutput');
                    container.scrollTop = container.scrollHeight;
                }, 50);
            }
            
            // Initialize neural background
            initNeuralNetwork();
            
            // Set up event listeners
            document.getElementById('catChoice').addEventListener('click', () => {
                choiceType = 'FELINE';
                showStage(3);
            });
            
            document.getElementById('dogChoice').addEventListener('click', () => {
                choiceType = 'CANINE';
                showStage(3);
            });
            
            document.getElementById('acceptProtocol').addEventListener('click', () => {
                showStage(4);
            });
            
            document.getElementById('rejectProtocol').addEventListener('click', () => {
                document.body.innerHTML = '<div class="stage active" style="justify-content:center;"><div class="big red-text">PROTOCOL TERMINATED</div><div class="text">Neural connection severed</div><div class="weird-text">Reality remains unchanged</div></div>';
            });
            
            document.getElementById('submitIdentity').addEventListener('click', () => {
                userName = userNameInput.value.trim() || 'ANONYMOUS_ENTITY';
                if (userName) showStage(5);
            });
            
            userNameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    userName = userNameInput.value.trim() || 'ANONYMOUS_ENTITY';
                    if (userName) showStage(5);
                }
            });
            
            document.getElementById('enterSimulation').addEventListener('click', () => {
                showStage(6);
            });
            
            // Reality controls
            document.getElementById('prevLayer').addEventListener('click', () => {
                showLayer(Math.max(currentLayer - 1, 0));
            });
            
            document.getElementById('nextLayer').addEventListener('click', () => {
                showLayer(Math.min(currentLayer + 1, 4));
            });
            
            document.getElementById('resetReality').addEventListener('click', () => {
                showLayer(0);
                activeSymbols.clear();
                document.querySelectorAll('.symbol').forEach(s => s.classList.remove('active'));
            });
            
            // Symbol interaction
            document.querySelectorAll('.symbol').forEach(symbol => {
                symbol.addEventListener('click', () => {
                    const value = symbol.getAttribute('data-value');
                    
                    if (activeSymbols.has(value)) {
                        activeSymbols.delete(value);
                        symbol.classList.remove('active');
                    } else {
                        activeSymbols.add(value);
                        symbol.classList.add('active');
                    }
                    
                    // Void symbol triggers paradox layer
                    if (value === '∅' && activeSymbols.has('∅')) {
                        setTimeout(() => showLayer(1), 1000);
                    }
                });
            });
            
            // Initial stage timeout
            setTimeout(() => {
                if (currentStage === 1) showStage(2);
            }, 3000);
            
            // Easter egg handler
            document.querySelector('.alexander-hint').addEventListener('click', () => {
                const hint = document.createElement('div');
                hint.className = 'text';
                hint.style.color = '#ff4100';
                hint.style.marginTop = '20px';
                hint.style.animation = 'fadeIn 2s';
                hint.innerHTML = 'ALEXANDER SECRET: Press ∅ then ∫ then ∇ to unlock hidden reality layer';
                document.getElementById('stage5').appendChild(hint);
            });
        });
    </script>
</body>
</html>
