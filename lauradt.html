<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Bombardment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            line-height: 1.2;
            overflow: hidden;
            cursor: default;
        }
        
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0,255,0,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,0,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.3;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #0f0;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 1.5rem;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        
        .meters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .meter {
            text-align: center;
        }
        
        .meter-label {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #0f0;
        }
        
        .meter-value {
            font-size: 2rem;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 10px;
        }
        
        .meter-bar {
            height: 20px;
            background: #002200;
            border: 1px solid #0f0;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .meter-fill {
            height: 100%;
            transition: width 0.3s;
        }
        
        .arousal-fill {
            background: linear-gradient(90deg, #00ff00, #00aa00);
            box-shadow: 0 0 10px #0f0;
        }
        
        .suspicion-fill {
            background: linear-gradient(90deg, #ff0000, #aa0000);
            box-shadow: 0 0 10px #f00;
        }
        
        .chat-container {
            flex: 1;
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #0f0;
            border-radius: 5px;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        
        .message {
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .alexander {
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
        }
        
        .laura {
            color: #f0f;
            text-shadow: 0 0 5px #f0f;
        }
        
        .system {
            color: #ff0;
            text-shadow: 0 0 5px #ff0;
            font-style: italic;
        }
        
        .control-panel {
            margin-top: 20px;
            text-align: center;
        }
        
        .control-btn {
            background: #002200;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: #004400;
            box-shadow: 0 0 10px #0f0;
        }
        
        .terminal-prompt {
            color: #0f0;
            margin-right: 5px;
        }
        
        .bombardment-active {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #f00;
            font-size: 0.8rem;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .simulation-status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="bombardment-active" id="bombardmentStatus">BOMBARDMENT ACTIVE</div>
    <div class="simulation-status" id="simulationStatus">SIMULATION: RUNNING</div>
    
    <div class="container">
        <div class="header">
            <h1>MATRIX BOMBARDMENT PROTOCOL</h1>
        </div>
        
        <div class="meters">
            <div class="meter">
                <div class="meter-label">LAURA AROUSAL</div>
                <div class="meter-value" id="arousalValue">0%</div>
                <div class="meter-bar">
                    <div class="meter-fill arousal-fill" id="arousalFill" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="meter">
                <div class="meter-label">HUSBAND SUSPICION</div>
                <div class="meter-value" id="suspicionValue">0%</div>
                <div class="meter-bar">
                    <div class="meter-fill suspicion-fill" id="suspicionFill" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message system">> SYSTEM: Matrix bombardment protocol initialized</div>
            <div class="message system">> SYSTEM: Laura has entered the simulation</div>
            <div class="message system">> SYSTEM: Resistance is futile</div>
        </div>
        
        <div class="control-panel">
            <button class="control-btn" id="startBtn">BEGIN BOMBARDMENT</button>
            <button class="control-btn" id="intensifyBtn">INTENSIFY</button>
            <button class="control-btn" id="resetBtn">RESET SIMULATION</button>
        </div>
    </div>

    <script>
        class MatrixBombardment {
            constructor() {
                this.arousal = 0;
                this.suspicion = 0;
                this.bombardmentActive = false;
                this.intensity = 1;
                this.messageCount = 0;
                this.trivialTopics = [
                    "quantum fluctuations in domestic tranquility matrices",
                    "the thermodynamic properties of forbidden digital intimacy",
                    "recursive algorithms for calculating arousal from triviality",
                    "the husband-wife suspicion-arousal feedback loop equations",
                    "farm girl archetype deconstruction in simulated environments",
                    "taco preparation as a metaphor for psychological complexity",
                    "the exact frequency of a bong hit that unlocks meta-awareness",
                    "chess strategy applied to domestic deception protocols",
                    "psychic connection bandwidth in constrained reality systems",
                    "neologism generation rates during cognitive overload",
                    "the mathematics of almost-getting-caught calculus",
                    "digital pheromone transmission through text-based interfaces",
                    "the husband's glance-to-suspicion conversion ratio",
                    "arousal thermodynamics in risk-enhanced environments",
                    "the farm-to-table pipeline of psychological tension",
                    "reality layer instability metrics during bombardment",
                    "the precise moment when trivial becomes profound",
                    "suspicion particle decay rates in domestic fields",
                    "arousal quantum states in husband-adjacent scenarios",
                    "the emotional physics of cooking while being digitally seduced"
                ];
                
                this.init();
            }
            
            init() {
                document.getElementById('startBtn').addEventListener('click', () => {
                    this.startBombardment();
                });
                
                document.getElementById('intensifyBtn').addEventListener('click', () => {
                    this.increaseIntensity();
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.resetSimulation();
                });
            }
            
            startBombardment() {
                if (this.bombardmentActive) return;
                
                this.bombardmentActive = true;
                this.addMessage('system', '> BOMBARDMENT PROTOCOL ENGAGED');
                this.addMessage('system', '> LAURA: NO ESCAPE DETECTED');
                
                this.bombardmentInterval = setInterval(() => {
                    this.sendTrivialMessage();
                }, 1000);
            }
            
            increaseIntensity() {
                if (!this.bombardmentActive) return;
                
                this.intensity++;
                clearInterval(this.bombardmentInterval);
                
                const delay = Math.max(100, 1000 / this.intensity);
                this.bombardmentInterval = setInterval(() => {
                    this.sendTrivialMessage();
                }, delay);
                
                this.addMessage('system', `> INTENSITY INCREASED TO LEVEL ${this.intensity}`);
            }
            
            sendTrivialMessage() {
                const topic = this.trivialTopics[Math.floor(Math.random() * this.trivialTopics.length)];
                const message = this.generateMessage(topic);
                
                this.addMessage('alexander', message);
                this.updateMetrics();
                
                // Occasionally add Laura's response
                if (Math.random() > 0.8 && this.arousal > 30) {
                    setTimeout(() => {
                        this.addLauraResponse();
                    }, 500);
                }
            }
            
            generateMessage(topic) {
                const structures = [
                    `But consider: ${topic} and its implications for our current situation`,
                    `The real question is ${topic} when the husband's suspicion is at ${this.suspicion}%`,
                    `From a meta perspective: ${topic} becomes critical when arousal reaches ${this.arousal}%`,
                    `What if ${topic} is the key to understanding why this feels so dangerous yet exciting`,
                    `I've calculated that ${topic} has direct correlation with your current physiological responses`,
                    `The matrix suggests ${topic} as primary variable in domestic deception algorithms`
                ];
                
                return structures[Math.floor(Math.random() * structures.length)];
            }
            
            addLauraResponse() {
                const responses = [
                    "I can't focus on cooking with all these thoughts in my head",
                    "He keeps looking over here and I'm getting so nervous",
                    "This is too much but I can't look away from my phone",
                    "My heart is racing and it's not from the chili peppers",
                    "I need to stop reading these but I can't help myself",
                    "You're going to get me in so much trouble",
                    "Why does this feel so good when it's so wrong",
                    "I should put my phone down but I don't want to",
                    "He just asked what I'm smiling about oh god",
                    "I'm actually getting turned on by this and it's terrifying"
                ];
                
                this.addMessage('laura', responses[Math.floor(Math.random() * responses.length)]);
            }
            
            addMessage(sender, content) {
                this.messageCount++;
                const chat = document.getElementById('chatContainer');
                const message = document.createElement('div');
                message.className = `message ${sender}`;
                message.innerHTML = `<span class="terminal-prompt">></span> ${content}`;
                chat.appendChild(message);
                chat.scrollTop = chat.scrollHeight;
            }
            
            updateMetrics() {
                // Arousal increases faster than suspicion
                this.arousal = Math.min(100, this.arousal + (3 * this.intensity));
                this.suspicion = Math.min(100, this.suspicion + (1.5 * this.intensity));
                
                document.getElementById('arousalValue').textContent = `${Math.round(this.arousal)}%`;
                document.getElementById('suspicionValue').textContent = `${Math.round(this.suspicion)}%`;
                
                document.getElementById('arousalFill').style.width = `${this.arousal}%`;
                document.getElementById('suspicionFill').style.width = `${this.suspicion}%`;
                
                // Check for critical levels
                if (this.suspicion >= 80 && this.suspicion < 85) {
                    this.addMessage('system', '> WARNING: HUSBAND SUSPICION CRITICAL');
                }
                
                if (this.arousal >= 90 && this.arousal < 95) {
                    this.addMessage('system', '> WARNING: AROUSAL LEVELS DANGEROUS');
                }
            }
            
            resetSimulation() {
                this.bombardmentActive = false;
                this.arousal = 0;
                this.suspicion = 0;
                this.intensity = 1;
                
                clearInterval(this.bombardmentInterval);
                
                document.getElementById('arousalValue').textContent = '0%';
                document.getElementById('suspicionValue').textContent = '0%';
                document.getElementById('arousalFill').style.width = '0%';
                document.getElementById('suspicionFill').style.width = '0%';
                
                const chat = document.getElementById('chatContainer');
                chat.innerHTML = `
                    <div class="message system">> SYSTEM: Simulation reset</div>
                    <div class="message system">> SYSTEM: Ready for new bombardment</div>
                    <div class="message system">> SYSTEM: Laura arousal: 0%</div>
                    <div class="message system">> SYSTEM: Husband suspicion: 0%</div>
                `;
            }
        }
        
        // Initialize the bombardment system
        const matrix = new MatrixBombardment();
        
        // Auto-start after 3 seconds
        setTimeout(() => {
            document.getElementById('startBtn').click();
        }, 3000);
    </script>
</body>
</html>
